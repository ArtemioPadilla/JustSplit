name: CI

on:
  push:
    # Branch conventions this repo uses (CLAUDE.md): phase-N/…, the long-lived
    # `inceptor` integration branch (Track B), Conventional-Commit-style
    # feat/fix/docs/chore branches, and the Claude Code session branches.
    branches:
      - main
      - inceptor
      - 'phase-*/**'
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'claude/**'
  pull_request:
    branches: [main, inceptor]

# One run per branch: a new push cancels the in-flight run instead of
# queueing N parallel runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The job name is the required status check on `main` (and on `inceptor`
    # during Track B) — see .claude/checklists/governance.md. Rename both or neither.
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          # @cyber-eco/* is published to GitHub Packages (plan B1). setup-node
          # writes the scoped registry + auth token into .npmrc; inert until the
          # packages are added and the GH_PACKAGES_TOKEN secret exists (plan A4).
          registry-url: https://npm.pkg.github.com
          scope: '@cyber-eco'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      # `check` is the umbrella gate (lint → type-check → test → build). Its
      # body changes in B1 (Astro tree); its name never does — CLAUDE.md.
      - name: Check (lint, type-check, test, build)
        run: npm run check
      # ---------------------------------------------------------------------
      # Accessibility smoke (plan B6): deliberately its own step, not part of
      # `npm run check` above — see scripts/axe-smoke.mjs's header comment
      # for why (same reasoning CLAUDE.md already applies to `test:rls`).
      # Runs against the dist/ the `check` step above just built. This
      # sandbox's preinstalled Chromium (/opt/pw-browsers/chromium) doesn't
      # exist on a GitHub-hosted runner, so install one here first.
      # ---------------------------------------------------------------------
      - name: Install Chromium for the accessibility smoke check
        run: npx playwright-core install --with-deps chromium
      - name: Accessibility smoke (axe-core)
        run: npm run check:a11y
      # Offline shell smoke (plan B19): builds its own copy under the staging base
      # path (`/JustSplit`), lets the service worker install in a real Chromium,
      # then goes offline and asserts what the worker answers (scripts/offline-smoke.mjs).
      # Its own step for the same reason as the axe smoke (needs a browser), and no
      # Supabase stack, so it belongs here and not in the RLS job.
      - name: Offline shell smoke (service worker)
        run: npm run check:offline

  # ---------------------------------------------------------------------------
  # RLS suite (plan B2b): the dbmate migrations applied to a real local
  # Supabase stack, then every table × command × member/non-member/anonymous
  # cell, storage, functions, batch_write, Realtime and the coverage guard.
  # No secret is used: the stack's keys come from `supabase status` inside the
  # runner. Required on `inceptor` (A3b protection) and on `main` after cutover.
  # The real-adapter contract run (`test:contract:live`) joined this job in B5a,
  # and the live end-to-end smoke (`test:live`, plan A7) in A7: it needs this
  # same stack, and living here means it is already covered by the required
  # check, with no second `supabase start` (image pulls dominate) and no new
  # required-check name to configure.
  # ---------------------------------------------------------------------------
  rls:
    name: RLS & contract (supabase start)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com
          scope: '@cyber-eco'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Start the local Supabase stack
        run: npm run db:start
      - name: Apply the dbmate migrations
        run: npm run db:migrate
      - name: RLS suite
        run: npm run test:rls
      # Real-adapter half of the storage-adapter contract suite (plan B5a):
      # RelationalSupabaseAdapter against this same local stack. No secret —
      # it reuses src/tests/rls/fixtures.ts's actor client (never client.ts),
      # which reads the stack's keys via `supabase status`, same as the RLS
      # suite above. Deliberately sets no public config env var here:
      # supabase-workflow-env.test.ts asserts this file never does, so the
      # `build` job's coverage of the guarded/disabled client.ts path stays
      # meaningful.
      - name: Storage-adapter contract suite (real adapter)
        run: npm run test:contract:live
      # ---------------------------------------------------------------------
      # Live end-to-end smoke (plan A7): a production build made against this
      # stack, driven in Chromium — real sign-in, the critical flows with the
      # database checked through the service role, and axe + overflow on every
      # signed-in page state in light, dark and 375px (scripts/live-smoke.mjs).
      # No secret and no public-config variable here: the script reads the
      # stack's keys from `supabase status` and passes them to its own build
      # (supabase-workflow-env.test.ts asserts this file never names them).
      # Its own step, never part of `npm run check` (needs Docker + a browser).
      # ---------------------------------------------------------------------
      - name: Install Chromium for the live smoke
        run: npx playwright-core install --with-deps chromium
      - name: Live end-to-end smoke
        run: npm run test:live
      - name: Stop the stack
        if: always()
        run: npm run db:stop

  # ---------------------------------------------------------------------------
  # actionlint — static analysis for all workflow files (ported from Inceptor).
  # Catches env-var conditions that always evaluate false, mutable
  # `uses: action@main` refs, unquoted ${{ inputs.* }} interpolations in run:
  # blocks, invalid event names / step syntax. The binary is downloaded
  # directly (SHA-pinned version + checksum) so the only third-party code
  # running here is the pinned actionlint itself.
  # ---------------------------------------------------------------------------
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    # Only on PRs and pushes to the protected branches — a feature-branch push
    # is covered by its PR run.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/inceptor'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download actionlint v1.7.12 (SHA-pinned)
        # The SHA is the sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the
        # official checksums file. Update both when bumping the version.
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: Scan for unpinned third-party action refs (mutable @branch refs)
        # Flags any third-party `uses:` ref that is NOT pinned to a 40-hex
        # commit SHA. First-party actions/* and github/*, and local ./ refs,
        # are exempt. `-rn` so a failure names the workflow and line.
        run: |
          UNPINNED=$(grep -rnE "^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+" \
              .github/workflows/*.yml \
            | sed -E 's/#.*$//' \
            | grep -vE "uses:[[:space:]]+(actions/|github/|\\./)" \
            | grep -vE "@[0-9a-f]{40}[[:space:]]*$" \
            || true)
          if [ -n "$UNPINNED" ]; then
            echo "ERROR: unpinned third-party action refs found:"
            echo "$UNPINNED"
            exit 1
          fi
          echo "OK: all third-party action refs appear to be SHA-pinned."
